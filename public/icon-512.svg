<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Black rounded square background -->
  <rect width="512" height="512" rx="80" fill="#000" />
  <!-- Bone icon - IDENTICAL to header.tsx, scaled 16x -->
  <g transform="translate(64,56) scale(16)">
    <!-- Left knob -->
    <circle cx="7" cy="12" r="4.5" fill="#e3ff40" stroke="#000" stroke-width="2.5" />
    <!-- Right knob -->
    <circle cx="17" cy="12" r="4.5" fill="#e3ff40" stroke="#000" stroke-width="2.5" />
    <!-- Shaft fill -->
    <rect x="6" y="9" width="12" height="6" fill="#e3ff40" />
    <!-- Shaft strokes -->
    <path d="M 6 9 L 18 9" stroke="#000" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 6 15 L 18 15" stroke="#000" stroke-width="2.5" stroke-linecap="round" />
    <!-- Indentation dips -->
    <rect x="5.5" y="7" width="3" height="2.5" rx="0.8" fill="#000" />
    <rect x="5.5" y="14.5" width="3" height="2.5" rx="0.8" fill="#000" />
    <rect x="15.5" y="7" width="3" height="2.5" rx="0.8" fill="#000" />
    <rect x="15.5" y="14.5" width="3" height="2.5" rx="0.8" fill="#000" />
    <!-- Marrow lines -->
    <path d="M 9.5 10 L 9.5 14" stroke="#000" stroke-width="1" opacity="0.2" stroke-linecap="round" />
    <path d="M 14.5 10 L 14.5 14" stroke="#000" stroke-width="1" opacity="0.2" stroke-linecap="round" />
    <path d="M 12 10.5 L 12 13.5" stroke="#000" stroke-width="1" opacity="0.15" stroke-linecap="round" />
  </g>
  <!-- Text: BONKEST -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="56" fill="#e3ff40" letter-spacing="12">BONKEST</text>
  <!-- Underline accent -->
  <rect x="140" y="458" width="232" height="4" rx="2" fill="#e3ff40" opacity="0.3" />
  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="76" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="4" />
</svg>
